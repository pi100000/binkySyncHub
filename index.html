<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peer Sync</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>Peer Sync</h1>
        <p id="engine-status" class="status">checking engine…</p>
      </header>

      <section>
        <div class="section-head">
          <h2>Your shared items</h2>
          <div class="button-row">
            <button id="share-folder-btn">+ Folder</button>
            <button id="share-files-btn">+ Files</button>
          </div>
        </div>
        <ul id="shared-list" class="item-list">
          <li class="empty">Nothing shared yet.</li>
        </ul>
      </section>

      <section>
        <h2>Available to download</h2>
        <ul id="browse-list" class="item-list">
          <li class="empty">Looking for friends…</li>
        </ul>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
